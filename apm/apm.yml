# Reference copy of ~/.apm/apm.yml (apm's fixed-location, user-scope manifest).
# Copied into place by hand — nothing syncs it. See docs/ai.md.
#
# `apm install --global` deploys each skill to ~/.agents/skills/ (OpenCode/pi)
# and ~/.claude/skills/ (Claude Code).
#
# Personal-machine manifest; a work machine keeps its own with internal repos,
# never committed here.
#
# Pin `ref:` to a tag when upstream publishes one — otherwise the dependency
# tracks the default branch and only apm.lock.yaml pins the commit.
name: agent-configs-skills
version: 0.1.0
description: Shared agent skills managed by agent-configs

# Named explicitly so deployment is identical on every machine — auto-detect
# would skip `agent-skills` (needed by pi, which has no apm profile of its own)
# and could reach into ~/.config/opencode/, which `make sync-opencode` owns.
targets:
  - claude
  - agent-skills

dependencies:
  apm:
    # `path:` pulls one skill out of a repo that isn't itself an apm package
    # (or that ships hooks — a whole-repo dep would deploy those into
    # ~/.claude/settings.json, which `make sync-claude` owns).
    - git: cocoon-ai/architecture-diagram-generator
      path: architecture-diagram
      ref: "1.1"
    # Unpinned on purpose: skills/ only exists on the default branch; every
    # published tag resolves to a tree without it.
    - git: upstash/context7
      skills:
        - find-docs
    # Pinned to a commit, not v1.1.0: that tag predates the per-skill
    # agents/openai.yaml files (plugin.json already claims 1.2.0 on default).
    # `apm outdated` flags this against the tag — false positive, ignore it.
    - git: mattpocock/skills
      ref: 2ab958093e83e0ec752e6c1c5932da465bf23e0c
      skills:
        - skills/productivity/grill-me
        - skills/engineering/grill-with-docs
        - skills/productivity/handoff
        - skills/productivity/writing-great-skills
    # superpowers ships hooks/hooks.json; a whole-repo dep would register its
    # SessionStart hook in ~/.claude/settings.json, so take the skill path
    # directly.
    - git: obra/superpowers
      path: skills/test-driven-development
      ref: v6.2.0
    - git: obra/superpowers
      path: skills/using-git-worktrees
      ref: v6.2.0
