name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y stow jq jsonnet
        # mikefarah yq v4 is preinstalled on ubuntu-latest; apt's "yq" is an
        # incompatible tool, so install the official binary only if missing.
        if ! command -v yq >/dev/null 2>&1; then
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
        fi

    - name: Run syntax check
      run: make check-syntax

    - name: Run sync smoke tests
      run: make test-sync-smoke

    - name: Run safety regression tests
      run: make test-safety
